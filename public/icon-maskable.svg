<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D4E" />
      <stop offset="100%" stop-color="#0f2b2c" />
    </linearGradient>
    <linearGradient id="maskLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#2D5A27" />
    </linearGradient>
    <linearGradient id="maskWarmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F27D26" />
      <stop offset="100%" stop-color="#D94E33" />
    </linearGradient>
  </defs>
  
  <!-- Full bleed background for Android maskable icon -->
  <rect width="512" height="512" fill="url(#maskBg)" />
  
  <!-- Content placed strictly within safe zone (center 75%) -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Cultural concentric ripple rings -->
    <circle cx="256" cy="256" r="190" fill="none" stroke="#D1E8E2" stroke-width="4" opacity="0.15" stroke-dasharray="8 8" />
    <circle cx="256" cy="256" r="145" fill="none" stroke="#D1E8E2" stroke-width="4" opacity="0.2" />
    
    <!-- Stylized tea leaf & brain lobes -->
    <path d="M 256 120 C 180 120 140 180 140 250 C 140 320 200 370 256 390 C 256 320 240 240 256 120 Z" fill="url(#maskLeafGrad)" opacity="0.95" />
    <path d="M 256 120 C 332 120 372 180 372 250 C 372 320 312 370 256 390 C 256 320 272 240 256 120 Z" fill="url(#maskLeafGrad)" opacity="0.85" />
    
    <path d="M 256 150 L 256 370" stroke="#FDF3E1" stroke-width="8" stroke-linecap="round" />
    <circle cx="256" cy="180" r="18" fill="url(#maskWarmGrad)" />
    <circle cx="210" cy="230" r="14" fill="#FDF3E1" opacity="0.9" />
    <circle cx="302" cy="230" r="14" fill="#FDF3E1" opacity="0.9" />
    <circle cx="195" cy="295" r="12" fill="#F27D26" />
    <circle cx="317" cy="295" r="12" fill="#F27D26" />

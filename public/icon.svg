<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D4E" />
      <stop offset="100%" stop-color="#0f2b2c" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#2D5A27" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F27D26" />
      <stop offset="100%" stop-color="#D94E33" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle cultural concentric ripple rings representing memory & ripples in Brahmaputra -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#D1E8E2" stroke-width="4" opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="#D1E8E2" stroke-width="4" opacity="0.2" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#D1E8E2" stroke-width="3" opacity="0.25" />
  
  <!-- Central stylized tea leaf & brain lobes symbol -->
  <!-- Left lobe / tea leaf -->
  <path d="M 256 120 C 180 120 140 180 140 250 C 140 320 200 370 256 390 C 256 320 240 240 256 120 Z" fill="url(#leafGrad)" opacity="0.95" />
  <!-- Right lobe / tea leaf -->
  <path d="M 256 120 C 332 120 372 180 372 250 C 372 320 312 370 256 390 C 256 320 272 240 256 120 Z" fill="url(#leafGrad)" opacity="0.85" />
  
  <!-- Central stem / golden glowing memory spark -->
  <path d="M 256 150 L 256 370" stroke="#FDF3E1" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="180" r="18" fill="url(#warmGrad)" />
  <circle cx="210" cy="230" r="14" fill="#FDF3E1" opacity="0.9" />
  <circle cx="302" cy="230" r="14" fill="#FDF3E1" opacity="0.9" />
  <circle cx="195" cy="295" r="12" fill="#F27D26" />
  <circle cx="317" cy="295" r="12" fill="#F27D26" />

  <!-- Subtle 'S' curve connection -->
  <path d="M 256 180 Q 210 230 256 280 T 256 370" fill="none" stroke="#FDF3E1" stroke-width="5" stroke-linecap="round" opacity="0.7" />
</svg>
